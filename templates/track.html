{% extends "base.html" %}
{% block content %}
  <h2>Track your order</h2>
  <form method="get" action="/track">
    <input type="text" name="order_id" placeholder="Order ID" required>
    <button type="submit">Track</button>
  </form>
  {% if error %}
    <p>{{ error }}</p>
  {% endif %}
  <p><a href="{{ url_for('index') }}">&larr; Back to home</a></p>
{% endblock %}
