{% extends "base.html" %}
{% block content %}
<h2>Choose demo user</h2>
<p><strong>Demo only, no passwords.</strong> IDs do not provide real authentication.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">
<label for="user_id">Demo user ID</label>
<select id="user_id" name="user_id" required>
  <option value="">Select a user</option>
  {% for user in users %}
  <option value="{{ user['id'] }}">{{ user['id'] }} — {{ user['name'] }} ({{ user['role'] }}{% if user['restaurant_name'] %}: {{ user['restaurant_name'] }}{% endif %})</option>
  {% endfor %}
</select>
<button type="submit">Continue</button>
</form>
<p><a href="/">Back to Home</a></p>
{% endblock %}
