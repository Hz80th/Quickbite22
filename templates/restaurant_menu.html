{% extends "base.html" %}
{% block content %}
  <p><a href="{{ url_for('index') }}">&larr; Back to restaurants</a></p>
 
  <h2>{{ restaurant['name'] }}</h2>
 
  <button onclick="clearCart()">Clear Cart</button>
 
  <ul>
    {% for item in items %}
      <li>
        {{ item['name'] }} - ${{ "%.2f"|format(item['price_cents'] / 100) }}
        <button onclick="addToCart({{ item['id'] }})">Add</button>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
